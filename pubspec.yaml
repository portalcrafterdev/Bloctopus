name: blocktopus
description: "Blocktopus: Block Puzzle. Drag shapes onto an 8x8 grid, fill rows and columns to clear them."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Save data. See section 12.
  shared_preferences: ^2.3.3
  # Sound. See section 11. Used through a preloaded pool, never per sound.
  audioplayers: ^6.1.0
  # Ads. Deliberately outside the section 2 allowlist, and outside "no network
  # calls anywhere in v1": the owner answered section 17's open question about
  # ads by supplying live AdMob unit ids. Everything ad related lives under
  # lib/ads/ so the rest of the game stays offline and unaware of it.
  google_mobile_ads: ^9.1.0
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/audio/

  # Fredoka (display) and Nunito (body), both SIL Open Font License; the
  # licences are in assets/fonts/ beside them and the provenance in
  # NOTICE.txt. Both are variable fonts: one file per family carrying a whole
  # weight axis, which is why each is declared once with no per-weight assets.
  # See kDisplayFont in theme.dart for how the axis is selected.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
