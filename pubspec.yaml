name: blocktopus
description: "Blocktopus: Block Puzzle. Drag shapes onto an 8x8 grid, fill rows and columns to clear them."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Save data. See section 12.
  shared_preferences: ^2.3.3
  # Sound. See section 11. Used through a preloaded pool, never per sound.
  audioplayers: ^6.1.0
  # Ads. Deliberately outside the section 2 allowlist, and outside "no network
  # calls anywhere in v1": the owner answered section 17's open question about
  # ads by supplying live AdMob unit ids. Everything ad related lives under
  # lib/ads/ so the rest of the game stays offline and unaware of it.
  google_mobile_ads: ^9.1.0
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/audio/

  # Bagel Fat One, by Kyung-won Baek. SIL Open Font License, so it ships with
  # the game; the licence is in assets/fonts/BagelFatOne-OFL.txt and the
  # provenance in NOTICE.txt beside it. Used app wide - see kDisplayFont in
  # theme.dart. The file is 1.6 MB because it carries a full Hangul set the
  # game never draws; subsetting it to Latin would reclaim most of that.
  fonts:
    - family: BagelFatOne
      fonts:
        - asset: assets/fonts/BagelFatOne-Regular.ttf
