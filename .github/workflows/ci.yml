name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Unit, widget, layout, curve, audio and golden tests. The level validity
      # sweep is tagged `slow` and is excluded here; it has its own job.
      - run: flutter test --exclude-tags slow

  level-validity:
    name: Re-prove every shipped level
    runs-on: ubuntu-latest
    # Slow by design: it re-solves all 1500 levels at the full node budget.
    # Section 15 says this runs in CI only.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Run once and count what actually passed. A tag selection that matches
      # nothing, or a `skip:` in dart_test.yaml, exits 0 with everything
      # skipped: the job would go green having proved nothing. One chapter file
      # is one test, so fewer than 15 passes means the sweep did not really run.
      - name: Re-prove every shipped level
        run: |
          set -o pipefail
          flutter test --tags slow --reporter expanded \
            test/level_validity_test.dart 2>&1 | tee sweep.log
          passed=$(grep -c 'every level is solvable inside its move limit' \
            sweep.log || true)
          echo "chapters swept: $passed"
          if [ "$passed" -lt 15 ]; then
            echo "::error::the sweep did not run; check the slow tag in dart_test.yaml"
            exit 1
          fi

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: release signing needs the keystore secrets, which are not
      # available to pull requests from forks.
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  size-budget:
    name: App size budget
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      # Section 2 puts the app under 40 MB. Failing here is the point: it is
      # cheaper to notice an asset mistake now than after a store review.
      - name: Check the 40 MB budget
        run: |
          bytes=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          mb=$((bytes / 1024 / 1024))
          echo "arm64 release APK: ${mb} MB"
          if [ "$mb" -gt 40 ]; then
            echo "::error::APK is ${mb} MB, over the 40 MB budget in section 2"
            exit 1
          fi
