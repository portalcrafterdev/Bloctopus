<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF6B5E; } a:hover { color: #E2493C; }
    .dc-root { font-family: Nunito, "Helvetica Neue", Arial, sans-serif; }
    .sticker { border: 3px solid #FFFFFF; box-shadow: 0 6px 0 rgba(3,60,92,.28), 0 12px 22px -8px rgba(3,60,92,.5); }
    .panel { border-radius: 20px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.35); }
    .node { width: 60px; height: 60px; border-radius: 21px; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 18px; }
    .done { background: linear-gradient(180deg, #FFDE63, #FFAE1F); color: #7A4A00; border: 3px solid #fff; box-shadow: 0 5px 0 rgba(3,60,92,.3); }
    .lock { background: rgba(3,60,92,.24); border: 3px solid rgba(255,255,255,.3); color: rgba(255,255,255,.5); }
    .stars { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: linear-gradient(180deg, #2EE6D2 0%, #15B4D4 34%, #0B74C4 68%, #075495 100%); color: #fff; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="position: relative; z-index: 2; padding: 20px 18px 14px; display: flex; align-items: center; gap: 13px;">
    <button class="sticker" style="width: 42px; height: 42px; border-radius: 15px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="flex: 1;">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.2px;">Dive log</div>
      <div style="font-size: 12px; font-weight: 800; color: rgba(255,255,255,.78);">101 levels &middot; 148 stars</div>
    </div>
    <div class="panel" style="display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 13px; font-size: 12.5px; font-weight: 900;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFD23F"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>148
    </div>
  </div>

  <!-- path -->
  <div style="position: relative; flex: 1;">
    <svg viewBox="0 0 390 700" width="390" height="700" style="position: absolute; inset: 0;">
      <path d="M150 34 C240 104 130 174 200 254 C270 334 140 394 190 474 C235 549 150 604 200 684"
            stroke="rgba(255,255,255,.3)" stroke-width="5" fill="none" stroke-dasharray="3 13" stroke-linecap="round"/>
    </svg>

    <!-- chapter banner -->
    <div class="panel sticker" style="position: absolute; left: 20px; right: 20px; top: 4px; padding: 12px 17px; display: flex; align-items: center; justify-content: space-between; border-radius: 20px;">
      <div>
        <div style="font-size: 9.5px; font-weight: 900; letter-spacing: 2.4px; text-transform: uppercase; color: #FFE79A;">Chapter 2</div>
        <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -.3px; margin-top: 1px;">Kelp Forest</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 13px; font-weight: 900;">2 / 100</div>
        <div style="font-size: 10.5px; font-weight: 800; color: rgba(255,255,255,.75);">cleared</div>
      </div>
    </div>

    <!-- nodes -->
    <div style="position: absolute; left: 94px; top: 106px; text-align: center;">
      <div class="node done">101</div>
      <div class="stars">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.6"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.6"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.6"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      </div>
    </div>

    <!-- current node with mascot -->
    <div style="position: absolute; left: 166px; top: 212px;">
      <div style="position: relative;">
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 108px; height: 108px; border-radius: 50%; background: radial-gradient(circle, rgba(255,210,63,.4), rgba(255,210,63,0) 68%);"></div>
        <div class="node" style="position: relative; background: linear-gradient(180deg, #FFE887, #FF9F1C); color: #7A4A00; border: 4px solid #fff; box-shadow: 0 6px 0 rgba(3,60,92,.3), 0 12px 26px -8px rgba(255,159,28,.8);">102</div>
      </div>
      <div class="stars" style="opacity: .45;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      </div>
      <svg viewBox="0 0 70 66" width="64" height="60" style="position: absolute; left: 64px; top: -8px;">
        <g stroke="#8B5CF0" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M17 40 C14 50 15 57 18 62"/><path d="M28 44 C26 54 27 60 29 64"/>
          <path d="M42 44 C44 54 43 60 41 64"/><path d="M53 40 C56 50 55 57 52 62"/>
        </g>
        <ellipse cx="35" cy="27" rx="25" ry="23" fill="#8B5CF0"/>
        <ellipse cx="35" cy="19" rx="20" ry="13" fill="#B47CF5" opacity=".55"/>
        <ellipse cx="27" cy="27" rx="6" ry="7" fill="#fff"/><ellipse cx="43" cy="27" rx="6" ry="7" fill="#fff"/>
        <circle cx="28" cy="29" r="3.1" fill="#123A52"/><circle cx="44" cy="29" r="3.1" fill="#123A52"/>
        <path d="M31 36 q4 4 8 0" stroke="#123A52" stroke-width="1.9" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="position: absolute; left: 110px; top: 346px;"><div class="node lock">103</div></div>
    <div style="position: absolute; left: 206px; top: 440px;"><div class="node lock">104</div></div>
    <div style="position: absolute; left: 130px; top: 544px;">
      <div class="node lock" style="position: relative; border-color: rgba(255,210,63,.6); background: rgba(255,210,63,.14); color: rgba(255,231,154,.85);">
        105
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.6" style="position: absolute; top: -8px; right: -8px;"><path d="M5 18h14l1-9-5 3-3-6-3 6-5-3 1 9z"/></svg>
      </div>
    </div>
  </div>

  <div style="margin: 0 18px 16px; height: 52px; border-radius: 16px; border: 2.5px dashed rgba(255,255,255,.42); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; color: rgba(255,255,255,.72);">Banner</div>
</div>
</x-dc>
</body>
</html>
