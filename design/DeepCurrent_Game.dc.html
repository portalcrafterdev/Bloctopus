<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #35E8D5; } a:hover { color: #7BF3E6; }
    .dc-root { font-family: Sora, "Helvetica Neue", Arial, sans-serif; }
    .cell { border-radius: 22%; }
    .blk { border-radius: 22%; position: relative; }
    .blk::after { content: ""; position: absolute; left: 15%; top: 9%; width: 70%; height: 28%; border-radius: 12%; background: rgba(255,255,255,.28); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: radial-gradient(120% 60% at 50% 0%, #16304A 0%, #0A1626 48%, #060A12 100%); color: #EAF2FF; display: flex; flex-direction: column;">

  <!-- HUD -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 0;">
    <button style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9FB3CE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="text-align: center;">
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 2.6px; text-transform: uppercase; color: #5F7292;">Level 102</div>
      <div style="font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; font-variant-numeric: tabular-nums;">4,820</div>
    </div>
    <button style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#9FB3CE"><rect x="6" y="4" width="4" height="16" rx="1.6"/><rect x="14" y="4" width="4" height="16" rx="1.6"/></svg>
    </button>
  </div>

  <!-- goal -->
  <div style="margin: 16px 18px 0; padding: 13px 16px; border-radius: 16px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.075); display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFC24D"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <span style="font-size: 14px; font-weight: 600;">Collect 3 stars</span>
      </div>
      <span style="font-size: 13px; font-weight: 700; color: #35E8D5; font-variant-numeric: tabular-nums;">2 / 3</span>
    </div>
    <div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden;">
      <div style="width: 66%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #35E8D5, #7BD4FF);"></div>
    </div>
  </div>

  <!-- board -->
  <div style="margin: 18px 18px 0; padding: 10px; border-radius: 24px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.05);">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px;">
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 14px -2px rgba(255,198,31,.55);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 14px -2px rgba(255,198,31,.55);"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18; box-shadow: 0 0 14px -2px rgba(255,107,24,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 14px -2px rgba(255,198,31,.55);"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18; box-shadow: 0 0 14px -2px rgba(255,107,24,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF; box-shadow: 0 0 14px -2px rgba(199,125,255,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5; box-shadow: 0 0 14px -2px rgba(47,227,213,.55);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <!-- star cell -->
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF; box-shadow: 0 0 16px -2px rgba(61,155,255,.6); display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFC24D" style="position: relative; z-index: 1;"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      </div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18; box-shadow: 0 0 14px -2px rgba(255,107,24,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF; box-shadow: 0 0 14px -2px rgba(199,125,255,.5);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF; box-shadow: 0 0 14px -2px rgba(199,125,255,.5);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5; box-shadow: 0 0 14px -2px rgba(47,227,213,.55);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5; box-shadow: 0 0 14px -2px rgba(47,227,213,.55);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 14px -2px rgba(70,220,90,.6);"></div>

      <!-- row about to clear: lit -->
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 18px 1px rgba(255,198,31,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A; box-shadow: 0 0 18px 1px rgba(70,220,90,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 18px 1px rgba(255,198,31,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF; box-shadow: 0 0 18px 1px rgba(199,125,255,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5; box-shadow: 0 0 18px 1px rgba(47,227,213,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2; box-shadow: 0 0 18px 1px rgba(248,87,194,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF; box-shadow: 0 0 18px 1px rgba(61,155,255,.8);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18; box-shadow: 0 0 18px 1px rgba(255,107,24,.8);"></div>

      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F; box-shadow: 0 0 14px -2px rgba(255,198,31,.55);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2; box-shadow: 0 0 14px -2px rgba(248,87,194,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF; box-shadow: 0 0 14px -2px rgba(199,125,255,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>

      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF; box-shadow: 0 0 14px -2px rgba(61,155,255,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18; box-shadow: 0 0 14px -2px rgba(255,107,24,.5);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
      <div class="cell" style="aspect-ratio: 1; background: rgba(255,255,255,.045);"></div>
    </div>
  </div>

  <!-- tray -->
  <div style="margin: 16px 18px 0; padding: 14px 12px; border-radius: 22px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center; gap: 8px; height: 92px;">
    <!-- L piece -->
    <div style="display: grid; grid-template-columns: repeat(2, 22px); gap: 3px;">
      <div class="blk" style="width: 22px; height: 22px; background: #F857C2;"></div><div style="width: 22px; height: 22px;"></div>
      <div class="blk" style="width: 22px; height: 22px; background: #F857C2;"></div><div style="width: 22px; height: 22px;"></div>
      <div class="blk" style="width: 22px; height: 22px; background: #F857C2;"></div><div class="blk" style="width: 22px; height: 22px; background: #F857C2;"></div>
    </div>
    <!-- square -->
    <div style="display: grid; grid-template-columns: repeat(2, 22px); gap: 3px;">
      <div class="blk" style="width: 22px; height: 22px; background: #3D9BFF;"></div><div class="blk" style="width: 22px; height: 22px; background: #3D9BFF;"></div>
      <div class="blk" style="width: 22px; height: 22px; background: #3D9BFF;"></div><div class="blk" style="width: 22px; height: 22px; background: #3D9BFF;"></div>
    </div>
    <!-- line of 3 -->
    <div style="display: grid; grid-template-columns: repeat(3, 22px); gap: 3px;">
      <div class="blk" style="width: 22px; height: 22px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 22px; height: 22px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 22px; height: 22px; background: #2FE3D5;"></div>
    </div>
  </div>

  <!-- boosters -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; padding: 14px 18px 0;">
    <button style="height: 54px; border-radius: 16px; cursor: pointer; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #EAF2FF; font-family: Sora, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#35E8D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #9FB3CE;">Rewind</span>
      <span style="position: absolute; top: -6px; right: -4px; min-width: 19px; height: 19px; border-radius: 999px; background: #35E8D5; color: #05201C; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
    </button>
    <button style="height: 54px; border-radius: 16px; cursor: pointer; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: #EAF2FF; font-family: Sora, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#C77DFF"><path d="M12 3c3.6 4.6 6 7.9 6 10.6A6 6 0 016 13.6C6 10.9 8.4 7.6 12 3z"/></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #9FB3CE;">Ink blast</span>
      <span style="position: absolute; top: -6px; right: -4px; min-width: 19px; height: 19px; border-radius: 999px; background: #35E8D5; color: #05201C; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
    </button>
    <button style="height: 54px; border-radius: 16px; cursor: pointer; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); color: #5F7292; font-family: Sora, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5F7292" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 10-2 7"/><path d="M20 4v6h-6"/></svg>
      <span style="font-size: 10.5px; font-weight: 600;">Reshuffle</span>
      <span style="position: absolute; top: -6px; right: -4px; min-width: 19px; height: 19px; border-radius: 999px; background: rgba(255,255,255,.1); color: #9FB3CE; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;">0</span>
    </button>
  </div>

  <div style="flex: 1;"></div>
</div>
</x-dc>
</body>
</html>
