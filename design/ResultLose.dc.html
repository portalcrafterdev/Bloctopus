<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF6B5E; } a:hover { color: #E2493C; }
    .dc-root { font-family: Nunito, "Helvetica Neue", Arial, sans-serif; }
    .sticker { border: 3px solid #FFFFFF; box-shadow: 0 6px 0 rgba(3,60,92,.28), 0 12px 22px -8px rgba(3,60,92,.5); }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat b { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 21px; }
    .stat span { font-size: 10px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.72); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: linear-gradient(180deg, #1A9EC4 0%, #0B6FB4 46%, #07508E 100%); color: #fff; display: flex; flex-direction: column; justify-content: flex-end;">

  <div style="position: absolute; inset: 0; opacity: .26;">
    <div style="margin: 130px 18px 0; padding: 10px; border-radius: 26px; background: rgba(3,60,92,.3);">
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 4px;">
        <div style="aspect-ratio:1; border-radius:26%; background:#46DC5A;"></div><div style="aspect-ratio:1; border-radius:26%; background:#FFC61F;"></div><div style="aspect-ratio:1; border-radius:26%; background:#C77DFF;"></div><div style="aspect-ratio:1; border-radius:26%; background:#2FE3D5;"></div><div style="aspect-ratio:1; border-radius:26%; background:#3D9BFF;"></div><div style="aspect-ratio:1; border-radius:26%; background:#FF6B18;"></div><div style="aspect-ratio:1; border-radius:26%; background:#F857C2;"></div><div style="aspect-ratio:1; border-radius:26%; background:#46DC5A;"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,55,95,.55) 0%, rgba(5,55,95,.88) 40%, #07508E 66%);"></div>

  <div style="position: relative; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, #1585B8, #0A5E9E); border-top: 4px solid #fff; padding: 14px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px;">

    <div style="width: 46px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.45);"></div>

    <!-- mascot, sympathetic -->
    <div style="position: relative; margin-top: -2px;">
      <svg viewBox="0 0 100 92" width="94" height="86">
        <g stroke="#7A5AC4" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M24 56 C20 68 22 76 27 81"/><path d="M39 62 C37 73 38 80 42 84"/>
          <path d="M61 62 C63 73 62 80 58 84"/><path d="M76 56 C80 68 78 76 73 81"/>
        </g>
        <ellipse cx="50" cy="40" rx="35" ry="31" fill="#7A5AC4"/>
        <ellipse cx="50" cy="30" rx="28" ry="18" fill="#9B7FE0" opacity=".45"/>
        <ellipse cx="38" cy="41" rx="8.5" ry="9.5" fill="#fff"/>
        <ellipse cx="62" cy="41" rx="8.5" ry="9.5" fill="#fff"/>
        <circle cx="38" cy="44" r="4.4" fill="#123A52"/>
        <circle cx="62" cy="44" r="4.4" fill="#123A52"/>
        <path d="M43 57 q7 -5 14 0" stroke="#123A52" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <path d="M18 44 C26 30 36 30 42 36" stroke="#7A5AC4" stroke-width="9" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="text-align: center; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -.4px; text-shadow: 0 3px 0 rgba(3,60,92,.3);">Out of moves</div>
      <div style="font-size: 13.5px; font-weight: 700; color: rgba(255,255,255,.85); max-width: 280px;">Two lines short. Clearing the left column first opens more room.</div>
    </div>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); padding: 14px 0; border-radius: 20px; background: rgba(3,60,92,.26); border: 2px solid rgba(255,255,255,.28);">
      <div class="stat"><b>3,110</b><span>Score</span></div>
      <div class="stat" style="border-left: 2px solid rgba(255,255,255,.2); border-right: 2px solid rgba(255,255,255,.2);"><b>8</b><span>Lines</span></div>
      <div class="stat"><b>20</b><span>Moves</span></div>
    </div>

    <!-- continue offer: rewarded ad, opt-in -->
    <button class="sticker" style="width: 100%; height: 62px; border-radius: 21px; cursor: pointer; background: linear-gradient(180deg, #FFDE63, #FFAE1F); color: #7A4A00; font-family: Nunito, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A4A00" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M10 9.5v5l4-2.5-4-2.5z"/></svg>
      <span style="font-size: 15px; font-weight: 900;">Watch an ad for 5 more moves</span>
    </button>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 11px;">
      <button style="height: 58px; border-radius: 20px; cursor: pointer; background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.55); color: #fff; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 9px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 10-2 7"/><path d="M20 4v6h-6"/></svg>
        Try again
      </button>
      <button style="height: 48px; border-radius: 17px; cursor: pointer; background: transparent; border: 2.5px solid rgba(255,255,255,.35); color: rgba(255,255,255,.9); font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14.5px;">Back to map</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
