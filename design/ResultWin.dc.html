<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF6B5E; } a:hover { color: #E2493C; }
    .dc-root { font-family: Nunito, "Helvetica Neue", Arial, sans-serif; }
    .sticker { border: 3px solid #FFFFFF; box-shadow: 0 6px 0 rgba(3,60,92,.28), 0 12px 22px -8px rgba(3,60,92,.5); }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat b { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 21px; }
    .stat span { font-size: 10px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.72); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: linear-gradient(180deg, #1FC9CE 0%, #0F92CE 46%, #0A69B8 100%); color: #fff; display: flex; flex-direction: column; justify-content: flex-end;">

  <!-- dimmed board behind -->
  <div style="position: absolute; inset: 0; opacity: .3;">
    <div style="margin: 130px 18px 0; padding: 10px; border-radius: 26px; background: rgba(3,60,92,.28);">
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 4px;">
        <div style="aspect-ratio:1; border-radius:26%; background:#46DC5A;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#FFC61F;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#C77DFF;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#2FE3D5;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div>
        <div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#3D9BFF;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#FF6B18;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#F857C2;"></div><div style="aspect-ratio:1; border-radius:26%; background:rgba(3,60,92,.22);"></div><div style="aspect-ratio:1; border-radius:26%; background:#46DC5A;"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,70,120,.5) 0%, rgba(6,70,120,.85) 40%, #0A69B8 66%);"></div>

  <!-- sheet -->
  <div style="position: relative; border-radius: 30px 30px 0 0; background: linear-gradient(180deg, #1AC0D4, #0C82C4); border-top: 4px solid #fff; padding: 14px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 -12px 40px -12px rgba(3,60,92,.6);">

    <div style="width: 46px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.45);"></div>

    <!-- mascot, pleased -->
    <div style="position: relative; margin-top: -2px;">
      <svg viewBox="0 0 100 92" width="94" height="86">
        <g stroke="#8B5CF0" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M24 56 C19 70 21 80 25 86"/><path d="M39 62 C36 76 37 84 40 89"/>
          <path d="M61 62 C64 76 63 84 60 89"/><path d="M76 56 C81 70 79 80 75 86"/>
        </g>
        <ellipse cx="50" cy="38" rx="35" ry="32" fill="#8B5CF0"/>
        <ellipse cx="50" cy="27" rx="28" ry="19" fill="#B47CF5" opacity=".55"/>
        <path d="M33 36 q7 -8 14 0" stroke="#fff" stroke-width="4.6" fill="none" stroke-linecap="round"/>
        <path d="M53 36 q7 -8 14 0" stroke="#fff" stroke-width="4.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="27" cy="48" rx="6.5" ry="4" fill="#FF9AC1" opacity=".75"/>
        <ellipse cx="73" cy="48" rx="6.5" ry="4" fill="#FF9AC1" opacity=".75"/>
        <path d="M43 50 q7 7 14 0" stroke="#123A52" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="text-align: center; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -.4px; text-shadow: 0 3px 0 rgba(3,60,92,.3);">Level 102 cleared</div>
      <div style="font-size: 13.5px; font-weight: 700; color: rgba(255,255,255,.85);">Score 6,400 for the third star.</div>
    </div>

    <!-- stars -->
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.4" style="filter: drop-shadow(0 4px 0 rgba(3,60,92,.3));"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      <svg width="62" height="62" viewBox="0 0 24 24" fill="#FFD23F" stroke="#fff" stroke-width="1.4" style="filter: drop-shadow(0 5px 0 rgba(3,60,92,.3));"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      <svg width="50" height="50" viewBox="0 0 24 24" fill="rgba(3,60,92,.28)" stroke="rgba(255,255,255,.5)" stroke-width="1.6"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
    </div>

    <!-- stats -->
    <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); padding: 14px 0; border-radius: 20px; background: rgba(3,60,92,.24); border: 2px solid rgba(255,255,255,.3);">
      <div class="stat"><b>4,820</b><span>Score</span></div>
      <div class="stat" style="border-left: 2px solid rgba(255,255,255,.22); border-right: 2px solid rgba(255,255,255,.22);"><b>12</b><span>Lines</span></div>
      <div class="stat"><b>23</b><span>Moves</span></div>
    </div>

    <!-- booster award -->
    <div class="sticker" style="display: flex; align-items: center; gap: 9px; padding: 8px 15px; border-radius: 999px; background: #FF6B5E; box-shadow: 0 4px 0 rgba(3,60,92,.26);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 3c3.6 4.6 6 7.9 6 10.6A6 6 0 016 13.6C6 10.9 8.4 7.6 12 3z"/></svg>
      <span style="font-size: 12.5px; font-weight: 900;">+1 Ink blast earned</span>
    </div>

    <!-- actions -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 11px;">
      <button class="sticker" style="height: 60px; border-radius: 21px; cursor: pointer; background: linear-gradient(180deg, #FFDE63, #FFAE1F); color: #7A4A00; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 9px;">
        Next level
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A4A00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div style="display: flex; gap: 11px;">
        <button style="flex: 1; height: 50px; border-radius: 17px; cursor: pointer; background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.5); color: #fff; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px;">Replay</button>
        <button style="flex: 1; height: 50px; border-radius: 17px; cursor: pointer; background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.5); color: #fff; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px;">Map</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
