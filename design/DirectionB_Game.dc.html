<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chivo:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E03E5C; } a:hover { color: #B62C46; }
    .dc-root { font-family: Chivo, "Helvetica Neue", Arial, sans-serif; }
    .ink { border: 3px solid #1E1B16; }
    .stamp { box-shadow: 4px 4px 0 #1E1B16; }
    .cell { border: 2px solid rgba(30,27,22,.22); }
    .blk { border: 2.5px solid #1E1B16; box-shadow: 2px 2px 0 rgba(30,27,22,.55); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #F2ECDD; color: #1E1B16; display: flex; flex-direction: column;">
  <div style="position: absolute; inset: 0; pointer-events: none; opacity: .16; background-image: radial-gradient(#1E1B16 1px, transparent 1.2px); background-size: 7px 7px;"></div>

  <!-- HUD -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 0;">
    <button class="ink" style="width: 40px; height: 40px; background: #F2ECDD; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E1B16" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="text-align: center;">
      <div style="font-size: 10px; font-weight: 900; letter-spacing: 2.4px; text-transform: uppercase; color: #6B6353;">Level 102</div>
      <div style="font-family: 'Archivo Black', Arial Black, sans-serif; font-size: 30px; letter-spacing: -1px; line-height: 1.12;">4,820</div>
    </div>
    <button class="ink" style="width: 40px; height: 40px; background: #F2ECDD; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#1E1B16"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
  </div>

  <!-- goal -->
  <div class="ink stamp" style="position: relative; margin: 16px 18px 0; padding: 12px 14px; background: #FFF8EA; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 13.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .8px;">Collect 3 stars</span>
      <span style="font-size: 13px; font-weight: 900;">2 / 3</span>
    </div>
    <div style="height: 11px; border: 2.5px solid #1E1B16; background: #F2ECDD;">
      <div style="width: 66%; height: 100%; background: repeating-linear-gradient(45deg, #FF5C7A 0 6px, #E03E5C 6px 12px);"></div>
    </div>
  </div>

  <!-- board -->
  <div class="ink stamp" style="position: relative; margin: 18px 18px 0; padding: 9px; background: #E7DFCB;">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px;">
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#FFCB3D" stroke="#1E1B16" stroke-width="2"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      </div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
    </div>
  </div>

  <!-- tray -->
  <div class="ink" style="position: relative; margin: 16px 18px 0; padding: 12px; background: #E7DFCB; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); align-items: center; justify-items: center; gap: 8px; height: 86px;">
    <div style="display: grid; grid-template-columns: repeat(2, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div style="width: 21px; height: 21px;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div style="width: 21px; height: 21px;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div><div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div><div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
    </div>
  </div>

  <!-- boosters -->
  <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 11px; padding: 14px 18px 0;">
    <button class="ink stamp" style="height: 54px; background: #FFF8EA; cursor: pointer; font-family: Chivo, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E1B16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg>
      <span style="font-size: 10px; font-weight: 900; text-transform: uppercase;">Rewind</span>
      <span class="ink" style="position: absolute; top: -9px; right: -8px; min-width: 21px; height: 21px; background: #FFCB3D; font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;">3</span>
    </button>
    <button class="ink stamp" style="height: 54px; background: #FFF8EA; cursor: pointer; font-family: Chivo, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#C77DFF" stroke="#1E1B16" stroke-width="2"><path d="M12 3c3.6 4.6 6 7.9 6 10.6A6 6 0 016 13.6C6 10.9 8.4 7.6 12 3z"/></svg>
      <span style="font-size: 10px; font-weight: 900; text-transform: uppercase;">Ink blast</span>
      <span class="ink" style="position: absolute; top: -9px; right: -8px; min-width: 21px; height: 21px; background: #FFCB3D; font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;">2</span>
    </button>
    <button class="ink" style="height: 54px; background: #E7DFCB; cursor: pointer; font-family: Chivo, sans-serif; color: #9A907A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; border-color: #B8AF9A;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A907A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 10-2 7"/><path d="M20 4v6h-6"/></svg>
      <span style="font-size: 10px; font-weight: 900; text-transform: uppercase;">Reshuffle</span>
      <span style="position: absolute; top: -9px; right: -8px; min-width: 21px; height: 21px; border: 2.5px solid #B8AF9A; background: #E7DFCB; font-size: 10.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;">0</span>
    </button>
  </div>

  <div style="flex: 1;"></div>
</div>
</x-dc>
</body>
</html>
