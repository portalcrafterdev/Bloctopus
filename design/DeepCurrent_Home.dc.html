<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #35E8D5; } a:hover { color: #7BF3E6; }
    .dc-root { font-family: Sora, "Helvetica Neue", Arial, sans-serif; }
    .panel { border-radius: 18px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.075); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: radial-gradient(120% 70% at 50% 0%, #14263F 0%, #0A1220 45%, #060A12 100%); color: #EAF2FF; display: flex; flex-direction: column;">

  <!-- ambient bioluminescent motes -->
  <div style="position: absolute; inset: 0; pointer-events: none; opacity: .5;">
    <div style="position: absolute; left: 42px; top: 120px; width: 5px; height: 5px; border-radius: 50%; background: #35E8D5; box-shadow: 0 0 14px 3px rgba(53,232,213,.55);"></div>
    <div style="position: absolute; left: 320px; top: 210px; width: 3px; height: 3px; border-radius: 50%; background: #7BD4FF; box-shadow: 0 0 12px 3px rgba(123,212,255,.5);"></div>
    <div style="position: absolute; left: 96px; top: 330px; width: 3px; height: 3px; border-radius: 50%; background: #C77DFF; box-shadow: 0 0 12px 3px rgba(199,125,255,.45);"></div>
    <div style="position: absolute; left: 300px; top: 300px; width: 4px; height: 4px; border-radius: 50%; background: #35E8D5; box-shadow: 0 0 14px 3px rgba(53,232,213,.4);"></div>
  </div>

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z" fill="#FFC24D"/></svg>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .2px;">148</span>
    </div>
    <button style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9FB3CE" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#0A1220"/><circle cx="15" cy="12" r="2" fill="#0A1220"/><circle cx="8" cy="18" r="2" fill="#0A1220"/></svg>
    </button>
  </div>

  <!-- mascot + wordmark -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0 0;">
    <div style="position: relative; width: 124px; height: 114px;">
      <div style="position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,240,.42) 0%, rgba(139,92,240,0) 68%);"></div>
      <svg viewBox="0 0 150 138" width="124" height="114" style="position: relative;">
        <g stroke="#8B5CF0" stroke-width="13" stroke-linecap="round" fill="none">
          <path d="M33 84 C26 104 28 118 34 127"/>
          <path d="M52 92 C48 112 49 124 54 132"/>
          <path d="M75 95 C75 114 75 124 75 133"/>
          <path d="M98 92 C102 112 101 124 96 132"/>
          <path d="M117 84 C124 104 122 118 116 127"/>
        </g>
        <ellipse cx="75" cy="58" rx="52" ry="47" fill="#8B5CF0"/>
        <ellipse cx="75" cy="42" rx="42" ry="29" fill="#B47CF5" opacity=".5"/>
        <ellipse cx="58" cy="58" rx="12.5" ry="14" fill="#fff"/>
        <ellipse cx="92" cy="58" rx="12.5" ry="14" fill="#fff"/>
        <circle cx="60" cy="61" r="6.4" fill="#0A1220"/>
        <circle cx="94" cy="61" r="6.4" fill="#0A1220"/>
        <circle cx="57.5" cy="57" r="2.2" fill="#fff"/>
        <circle cx="91.5" cy="57" r="2.2" fill="#fff"/>
        <ellipse cx="44" cy="74" rx="8" ry="5" fill="#FF9AC1" opacity=".45"/>
        <ellipse cx="106" cy="74" rx="8" ry="5" fill="#FF9AC1" opacity=".45"/>
        <path d="M67 76 q8 7 16 0" stroke="#0A1220" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 34px; font-weight: 800; letter-spacing: -1.1px; line-height: 1;">Blocktopus</div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <span style="width: 20px; height: 1px; background: rgba(53,232,213,.5);"></span>
        <span style="font-size: 9.5px; font-weight: 600; letter-spacing: 3.2px; text-transform: uppercase; color: #35E8D5;">Block puzzle</span>
        <span style="width: 20px; height: 1px; background: rgba(53,232,213,.5);"></span>
      </div>
    </div>
  </div>

  <!-- continue card: progress and the primary action as one object -->
  <div class="panel" style="margin: 20px 18px 0; padding: 15px 16px 16px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 12px; font-weight: 600; color: #9FB3CE;">Chapter 2 &middot; Kelp Forest</span>
      <span style="font-size: 12px; font-weight: 600; color: #5F7292; font-variant-numeric: tabular-nums;">102 / 2000</span>
    </div>
    <div style="height: 5px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden;">
      <div style="width: 38%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #35E8D5, #7BD4FF);"></div>
    </div>
    <button style="height: 58px; border: none; border-radius: 17px; cursor: pointer; background: linear-gradient(180deg, #3DF0DC, #17BFAE); color: #05201C; font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 28px -10px rgba(53,232,213,.6);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#05201C"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
      Continue &middot; Level 102
    </button>
  </div>

  <!-- boosters you own: real save data, and a reason to come back -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; padding: 12px 18px 0;">
    <div class="panel" style="height: 58px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#35E8D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">3</span>
        <span style="font-size: 9.5px; font-weight: 500; color: #5F7292;">Rewind</span>
      </div>
    </div>
    <div class="panel" style="height: 58px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#C77DFF"><path d="M12 3c3.6 4.6 6 7.9 6 10.6A6 6 0 016 13.6C6 10.9 8.4 7.6 12 3z"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">2</span>
        <span style="font-size: 9.5px; font-weight: 500; color: #5F7292;">Ink blast</span>
      </div>
    </div>
    <div class="panel" style="height: 58px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7BD4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 10-2 7"/><path d="M20 4v6h-6"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">4</span>
        <span style="font-size: 9.5px; font-weight: 500; color: #5F7292;">Reshuffle</span>
      </div>
    </div>
  </div>

  <!-- the achievement you are closest to: gives the 20 of them a home -->
  <button class="panel" style="margin: 10px 18px 0; padding: 13px 15px; display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; color: inherit; font-family: Sora, sans-serif;">
    <div style="width: 42px; height: 42px; border-radius: 14px; background: rgba(255,194,77,.11); border: 1px solid rgba(255,194,77,.28); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFC24D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v6a6 6 0 01-12 0V4z"/><path d="M6 6H3v2a3 3 0 003 3M18 6h3v2a3 3 0 01-3 3M9 20h6M12 16v4"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
        <span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Reef Runner</span>
        <span style="font-size: 11.5px; font-weight: 600; color: #FFC24D; font-variant-numeric: tabular-nums; white-space: nowrap;">38 / 50</span>
      </div>
      <div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden;">
        <div style="width: 76%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFC24D, #FF9F1C);"></div>
      </div>
      <span style="font-size: 10.5px; color: #5F7292;">12 more levels to unlock</span>
    </div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3F506C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <!-- secondary destinations -->
  <div style="display: flex; gap: 10px; padding: 10px 18px 0;">
    <button class="panel" style="flex: 1; height: 48px; cursor: pointer; color: #EAF2FF; font-family: Sora, sans-serif; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#35E8D5" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg>
      Levels
    </button>
    <button class="panel" style="flex: 1; height: 48px; cursor: pointer; color: #EAF2FF; font-family: Sora, sans-serif; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7BD4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      Ranks
    </button>
  </div>

  <div style="flex: 1;"></div>

  <!-- ad slot, honest placeholder -->
  <div style="margin: 12px 18px 16px; height: 52px; border-radius: 14px; border: 1px dashed rgba(255,255,255,.13); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: #3F506C;">Banner</div>
</div>
</x-dc>
</body>
</html>
