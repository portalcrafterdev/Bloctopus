<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF6B5E; } a:hover { color: #E2493C; }
    .dc-root { font-family: Nunito, "Helvetica Neue", Arial, sans-serif; }
    .sticker { border: 3px solid #FFFFFF; box-shadow: 0 6px 0 rgba(3,60,92,.28), 0 12px 22px -8px rgba(3,60,92,.5); }
    .cell { border-radius: 26%; background: rgba(3,60,92,.22); }
    .blk { border-radius: 26%; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(3,60,92,.35); position: relative; }
    .blk::after { content: ""; position: absolute; left: 16%; top: 10%; width: 68%; height: 26%; border-radius: 40%; background: rgba(255,255,255,.42); }
  </style>
</helmet>

<div class="dc-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: linear-gradient(180deg, #1FC9CE 0%, #0F92CE 46%, #0A69B8 100%); color: #fff; display: flex; flex-direction: column;">

  <!-- HUD -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 0;">
    <button class="sticker" style="width: 42px; height: 42px; border-radius: 15px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="text-align: center;">
      <div style="font-size: 10.5px; font-weight: 900; letter-spacing: 2.4px; text-transform: uppercase; color: rgba(255,255,255,.75);">Level 102</div>
      <div style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; text-shadow: 0 3px 0 rgba(3,60,92,.35);">4,820</div>
    </div>
    <button class="sticker" style="width: 42px; height: 42px; border-radius: 15px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="4" width="4" height="16" rx="1.8"/><rect x="14" y="4" width="4" height="16" rx="1.8"/></svg>
    </button>
  </div>

  <!-- goal -->
  <div style="margin: 16px 18px 0; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.35); display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD23F"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
        <span style="font-size: 14.5px; font-weight: 900;">Collect 3 stars</span>
      </div>
      <span style="font-size: 13.5px; font-weight: 900; color: #FFD23F;">2 / 3</span>
    </div>
    <div style="height: 9px; border-radius: 999px; background: rgba(3,60,92,.3); overflow: hidden;">
      <div style="width: 66%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #FFD23F, #FF9F1C);"></div>
    </div>
  </div>

  <!-- board -->
  <div style="margin: 18px 18px 0; padding: 10px; border-radius: 26px; background: rgba(3,60,92,.28); border: 2.5px solid rgba(255,255,255,.3);">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px;">
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFD23F" style="position: relative; z-index: 1;"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3.1 1.3-6.2L3 9.6l6.3-.7L12 3z"/></svg>
      </div>

      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>

      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #2FE3D5;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FFC61F;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #F857C2;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #C77DFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #3D9BFF;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #FF6B18;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>

      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="blk" style="aspect-ratio: 1; background: #46DC5A;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
      <div class="cell" style="aspect-ratio: 1;"></div>
    </div>
  </div>

  <!-- tray -->
  <div style="margin: 16px 18px 0; padding: 12px; border-radius: 24px; background: rgba(3,60,92,.2); border: 2px solid rgba(255,255,255,.22); display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); align-items: center; justify-items: center; gap: 8px; height: 88px;">
    <div style="display: grid; grid-template-columns: repeat(2, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div style="width: 21px; height: 21px;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div style="width: 21px; height: 21px;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div><div class="blk" style="width: 21px; height: 21px; background: #F857C2;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div><div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div><div class="blk" style="width: 21px; height: 21px; background: #3D9BFF;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 21px); gap: 3px;">
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
      <div class="blk" style="width: 21px; height: 21px; background: #2FE3D5;"></div>
    </div>
  </div>

  <!-- boosters -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 11px; padding: 14px 18px 0;">
    <button class="sticker" style="height: 56px; border-radius: 18px; background: rgba(255,255,255,.22); cursor: pointer; font-family: Nunito, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg>
      <span style="font-size: 10.5px; font-weight: 900;">Rewind</span>
      <span class="sticker" style="position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; border-radius: 999px; background: #FFD23F; color: #7A4A00; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: none;">3</span>
    </button>
    <button class="sticker" style="height: 56px; border-radius: 18px; background: rgba(255,255,255,.22); cursor: pointer; font-family: Nunito, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#C77DFF"><path d="M12 3c3.6 4.6 6 7.9 6 10.6A6 6 0 016 13.6C6 10.9 8.4 7.6 12 3z"/></svg>
      <span style="font-size: 10.5px; font-weight: 900;">Ink blast</span>
      <span class="sticker" style="position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; border-radius: 999px; background: #FFD23F; color: #7A4A00; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: none;">2</span>
    </button>
    <button style="height: 56px; border-radius: 18px; background: rgba(3,60,92,.22); border: 3px solid rgba(255,255,255,.3); cursor: pointer; font-family: Nunito, sans-serif; color: rgba(255,255,255,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 10-2 7"/><path d="M20 4v6h-6"/></svg>
      <span style="font-size: 10.5px; font-weight: 900;">Reshuffle</span>
      <span style="position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; border-radius: 999px; background: rgba(3,60,92,.4); border: 2.5px solid rgba(255,255,255,.35); color: rgba(255,255,255,.7); font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;">0</span>
    </button>
  </div>

  <div style="flex: 1;"></div>
</div>
</x-dc>
</body>
</html>
